<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Designed Experience</title>

    <link rel="stylesheet" type="text/css" href="/css/style.css">

    <script src="/libraries/p5.min.js"></script>
    <script src="/libraries/p5.sound.min.js"></script>
    <style>
      .popup {
          display: none;
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.7);
          justify-content: center;
          align-items: center;
          z-index: 9999;
      }

      .popup-content {
          background: white;
          padding: 24px;
          border-radius: 12px;
          text-align: center;
          max-width: 300px;
      }
    </style>
  </head>

  <body>
    <div id="roomFullPopup" class="popup">
        <div class="popup-content">
            <h2>Room Full</h2>
            <p id="popupMessage"></p>
            <button id="reloadBtn">Try Again</button>
        </div>
    </div>

    <script src="input/sketch_input.js"></script>
    <script src="/socket.io/socket.io.js"></script>
  </body>
</html>
